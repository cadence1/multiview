services:
  multiview:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8080
      - DATA_DIR=/app/server/data
    volumes:
      - ./data:/app/server/data
    # Needed only for the optional SMB storage backend (recordings/smb.ts)
    # to mount a CIFS share — the app works fine without it, SMB storage
    # just stays unavailable (mount attempts fail cleanly, logged, nothing
    # else affected). Docker's own default seccomp profile already allows
    # the mount/umount2 syscalls conditionally on CAP_SYS_ADMIN being
    # present (confirmed directly from profiles/seccomp/default.json, not
    # just documentation) — no seccomp changes needed alongside this, and
    # this is *not* the same as --privileged (no device access, no broader
    # capability set, no seccomp bypass — just this one capability).
    cap_add:
      - SYS_ADMIN
    # cap_add alone isn't sufficient on an AppArmor-enforcing host (most
    # Debian/Ubuntu hosts, confirmed directly against a real deployment:
    # "Unable to apply new capability set" / "mount ... Permission denied"
    # even with SYS_ADMIN granted) — Docker's default "docker-default"
    # AppArmor profile is a separate mandatory-access-control layer on top
    # of capabilities/seccomp, and it blocks mount regardless of what
    # capabilities the container holds. This disables AppArmor confinement
    # for this one container rather than scoping a custom profile — same
    # tradeoff shape as the seccomp question already resolved above (this
    # app's own established posture is already fairly permissive — no auth
    # layer, plaintext credentials in .env/DB — per its own README).
    security_opt:
      - apparmor:unconfined
    restart: unless-stopped
