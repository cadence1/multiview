# Multiview CI — starter pipeline.
#
# What runs today: install dependencies and build both workspaces (client +
# server). `npm run build` invokes `tsc` for each, so this stage also serves as
# the typecheck — a type error fails the pipeline.
#
# Deliberately minimal. Placeholders for lint, test, Docker image build, and
# deploy-to-docker1 are stubbed out below (commented) so you can enable each as
# the project grows. See the notes at the bottom.

stages:
  - build
  # - test        # enable once lint/test scripts exist
  # - package     # enable to build & push a Docker image to the registry
  # - deploy      # enable to auto-deploy to docker1

default:
  image: node:22-alpine        # matches the Dockerfile build stage
  # Cache the npm download cache keyed on the lockfile, so unchanged deps are
  # restored between pipelines instead of re-downloaded.
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

build:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline   # deterministic install (uses lockfile)
    - npm run build                          # client build + server build (tsc = typecheck)
  artifacts:
    name: "multiview-build-$CI_COMMIT_SHORT_SHA"
    paths:
      - server/dist
      - client/dist
    expire_in: 1 week
  rules:
    # Run on merge requests and on any branch push.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

