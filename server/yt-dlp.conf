# System-wide yt-dlp config for the Docker image (copied to /etc/yt-dlp.conf
# in the runtime stage — see Dockerfile). yt-dlp reads this automatically on
# every invocation; no need to pass these flags at each call site in
# recorder.ts.
#
# --js-runtimes node
# yt-dlp needs a JS runtime to solve some of YouTube's own challenges
# (signature/PO-token related) — without one, extraction runs degraded
# ("YouTube extraction without a JS runtime has been deprecated, and some
# formats may be missing", confirmed directly against a real run in this
# image). Its default runtime is Deno, which isn't installed here and has
# no official Alpine/musl build of its own (would need a glibc compat shim
# just to run on this base image). Node is already present in this image
# for the app itself and meets yt-dlp's own minimum version requirement
# (22.0.0) for use as a JS runtime, so pointing yt-dlp at it avoids adding
# a second runtime just for this.
--js-runtimes node
